[project]
name = "orble-sdk"
version = "0.1.1"
description = "Orble: Linux boxes for agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://orble.tech"
Documentation = "https://orble.tech/docs?tab=sdk"
Repository = "https://github.com/lxe/orble-sdk"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orble"]
